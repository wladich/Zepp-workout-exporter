[project]
name = "zepp-workout-exporter"
version = "0.1.0"
description = "A Python script, which allows users to export workout data from Mi Fit and Zepp applications"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "gpxpy>=1.6.2",
    "pydantic>=2.10.6",
    "requests>=2.32.3",
]

[dependency-groups]
dev = [
    "pyright>=1.1.397",
    "ruff>=0.11.2",
]

[project.scripts]
zepp-workouts-export = "src.main:main"

[build-system]
requires = ["uv_build>=0.9.21,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "src"